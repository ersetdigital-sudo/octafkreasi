<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1E40AF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="9" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Inner subtle highlight -->
  <rect x="1" y="1" width="30" height="15" rx="8" fill="white" opacity="0.06"/>

  <!-- Wave top — bold -->
  <path d="M5 15.5L10.5 10L16 15.5L21.5 10L27 15.5"
    stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wave bottom — soft -->
  <path d="M5 21.5L10.5 16L16 21.5L21.5 16L27 21.5"
    stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
</svg>
